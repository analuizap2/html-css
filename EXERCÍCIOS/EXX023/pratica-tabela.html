<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        td{
            border: 1px solid black;
            width: 300px;
            padding: 2px;
        }
        table{
            border-collapse:collapse;
        }
        .linha{
            background-color: #ca7e7e;
        }
        .linha02{
            background-color: #5e95dd;
        }
    </style>
</head>
<body>
    <h1>Praticando tabelas</h1>
    <table>
        <tr>
            <td class="linha">Horizon Zero Dawn</td>
            <td class="linha02">Horizon Forbidden West</td>
        </tr>
        <tr>
            <td class="linha02">Far cry 4</td>
            <td class="linha">Far cry 6</td>
        </tr>
        <tr>
            <td class="linha">The Last of Us</td>
            <td class="linha02">The Last of Us II</td>
        </tr>
        <tr>
            <td class="linha02">Hogwarts Legacy</td>
            <td class="linha">Hogwarts Legacy II</td>
        </tr>
    </table>
</body>
</html>

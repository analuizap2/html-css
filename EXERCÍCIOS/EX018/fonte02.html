<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family:'Miracle History' ;
            src: url('fonts/Miracle History.ttf') format('truetype');
            font-weight:normal;
            font-style:normal;
            /*
             Tipos de format()
             -opentype(otf)
             -truetype(ttf)
             -embedded-opentype
             -truetype-aat(Apple Advanced Typography)
             -svg
            */
        }
        body{
            font-family:'Courier New', Courier, monospace
        }
        h1{
            font-family:'Miracle History';
            font-size:3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Voluptatibus cum ab itaque optio dolores sed commodi, asperiores autem, repudiandae voluptatem, praesentium officiis ducimus quam dicta harum repellendus vitae sunt? Aliquam.</p>
    
</body>
</html>

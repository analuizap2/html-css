<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        body{
            background-image: linear-gradient(to bottom,#d85353,#f79292);
            background-attachment: fixed;
        }
        h1{ /*Box-level*/
            background-color: rgb(147, 185, 223);
            height:300px;
            width:300px;
            border:10px solid #4cdada;

            padding:10px;

            margin:5px auto 5px auto;

            outline:5px dashed lightblue;
        }
        a{ /*Inline-level*/
            text-decoration: none;
            border:5px solid darkviolet;

            padding:5px;
        }
        a:hover{
            text-decoration:none;
            color:lightpink;
        }
        a:active{
            color:rgb(199, 113, 199)
        }
        p{
            font-family:monospace;
            font-weight:bold;
            text-align: justify;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>

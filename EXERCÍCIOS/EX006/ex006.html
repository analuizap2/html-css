<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
    <ul>
        <p><li><abbr title="&lt;p&gt;">Paragráfos</abbr></li></p>
        <li>
            <p><abbr title="&lt;h1&gt;">Títulos</abbr></p>
        </li>
        <p><li><abbr title="&lt;img&gt;">Imagens</abbr></li></p>
        <p><li><abbr title="&lt;abbr&gt;">Abreviações</abbr></li></p>
        <p><li><abbr title="&lt;li&gt;">Listas</abbr></li></p>
        <p><li></p><abbr title="&lt;em&gt;"><em>Itálico</em></li></abbr>
        <p><li><abbr title="&lt;code&gt;"><code></code>Código-fonte</code></abbr></li></p>
    </ul>
</body>
</html>
